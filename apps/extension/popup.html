<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kara</title>
    <style>
      /* An extension page, so none of this can reach a tab and nothing in a
         tab can reach it. Sized by content: a popup with a fixed height is a
         popup with a scrollbar in it on somebody's machine. */
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        padding: 12px;
        width: 20rem;
        font: 13px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        opacity: 0.6;
      }
      #headline {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }
      #detail {
        margin: 4px 0 0;
        opacity: 0.75;
      }
      #bar {
        display: block;
        width: 100%;
        height: 5px;
        margin: 8px 0 0;
        appearance: none;
        border: 0;
        border-radius: 3px;
        overflow: hidden;
        background: rgba(127, 127, 127, 0.28);
      }
      #bar::-webkit-progress-bar {
        background: rgba(127, 127, 127, 0.28);
      }
      #bar::-webkit-progress-value {
        background: #c58b00;
        transition: width 240ms linear;
      }
      #action {
        margin: 12px 0 0;
        width: 100%;
        padding: 7px 10px;
        font: inherit;
        font-weight: 600;
        border: 1px solid rgba(127, 127, 127, 0.5);
        border-radius: 8px;
        background: rgba(127, 127, 127, 0.12);
        cursor: pointer;
      }
      #action:hover:not(:disabled) {
        background: rgba(127, 127, 127, 0.22);
      }
      #action:disabled {
        opacity: 0.5;
        cursor: default;
      }
      fieldset {
        margin: 14px 0 0;
        padding: 8px 10px 10px;
        border: 1px solid rgba(127, 127, 127, 0.35);
        border-radius: 8px;
      }
      legend {
        padding: 0 4px;
        font-weight: 600;
      }
      label {
        display: flex;
        gap: 8px;
        align-items: start;
        margin-top: 6px;
      }
      /* Steppers rather than a slider: a key is a step, and half a semitone
         is not a thing anybody means to ask for. */
      #key-box .row {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      #key-box button {
        font: inherit;
        padding: 3px 9px;
        border: 1px solid rgba(127, 127, 127, 0.5);
        border-radius: 6px;
        background: rgba(127, 127, 127, 0.12);
        cursor: pointer;
      }
      #key-box button:hover:not(:disabled) {
        background: rgba(127, 127, 127, 0.22);
      }
      #key-box button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #key-value {
        flex: 1;
        text-align: center;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      #key-box #key-clear {
        font-size: 11px;
        font-weight: 400;
      }
      .hint {
        margin: 6px 0 0;
        font-size: 11px;
        opacity: 0.65;
      }
      /* Not a thing anybody needs to find quickly, and not a thing to hide
         either: the whole point is that it can be sent without being asked
         for twice. */
      #copy-debug {
        margin: 14px 0 0;
        width: 100%;
        padding: 5px 10px;
        font: inherit;
        font-size: 12px;
        border: 1px solid rgba(127, 127, 127, 0.4);
        border-radius: 8px;
        background: none;
        opacity: 0.8;
        cursor: pointer;
      }
      #copy-debug:hover {
        background: rgba(127, 127, 127, 0.12);
      }
      #debug-dump {
        margin: 6px 0 0;
        width: 100%;
        box-sizing: border-box;
        font: 11px/1.3 ui-monospace, monospace;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <h1>Kara live</h1>
    <!-- One live region, so a screen reader hears the state change rather
         than being told to go and look for it. -->
    <div id="state" role="status" aria-live="polite">
      <p id="headline">Checking…</p>
      <progress id="bar" max="100" value="0" hidden></progress>
      <p id="detail"></p>
    </div>
    <button id="action" type="button" disabled>Start</button>
    <fieldset id="key-box">
      <legend>Key</legend>
      <div class="row">
        <button id="key-down" type="button" title="Down a semitone">−</button>
        <span id="key-value" role="status" aria-live="polite">Original key</span>
        <button id="key-up" type="button" title="Up a semitone">+</button>
        <button id="key-clear" type="button" title="Back to the original key">Reset</button>
      </div>
      <p class="hint">Remembered, and used for the next song too.</p>
    </fieldset>
    <fieldset id="on-ready">
      <legend>When ready</legend>
    </fieldset>
    <!-- What to send when this goes wrong. The report is an origin, the
         measurements and a ring of events: no media, no video id, no title.
         src/debug-report.ts is the one place that redaction happens. -->
    <button id="copy-debug" type="button">Copy debug report</button>
    <p id="copy-note" class="hint" hidden></p>
    <textarea id="debug-dump" rows="4" readonly hidden></textarea>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>

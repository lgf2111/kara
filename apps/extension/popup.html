<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kara</title>
    <style>
      /* An extension page, so none of this can reach a tab and nothing in a
         tab can reach it. Sized by content: a popup with a fixed height is a
         popup with a scrollbar in it on somebody's machine. */
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        padding: 12px;
        width: 20rem;
        font: 13px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        opacity: 0.6;
      }
      #headline {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }
      #detail {
        margin: 4px 0 0;
        opacity: 0.75;
      }
      #bar {
        display: block;
        width: 100%;
        height: 5px;
        margin: 8px 0 0;
        appearance: none;
        border: 0;
        border-radius: 3px;
        overflow: hidden;
        background: rgba(127, 127, 127, 0.28);
      }
      #bar::-webkit-progress-bar {
        background: rgba(127, 127, 127, 0.28);
      }
      #bar::-webkit-progress-value {
        background: #c58b00;
        transition: width 240ms linear;
      }
      #action {
        margin: 12px 0 0;
        width: 100%;
        padding: 7px 10px;
        font: inherit;
        font-weight: 600;
        border: 1px solid rgba(127, 127, 127, 0.5);
        border-radius: 8px;
        background: rgba(127, 127, 127, 0.12);
        cursor: pointer;
      }
      #action:hover:not(:disabled) {
        background: rgba(127, 127, 127, 0.22);
      }
      #action:disabled {
        opacity: 0.5;
        cursor: default;
      }
      fieldset {
        margin: 14px 0 0;
        padding: 8px 10px 10px;
        border: 1px solid rgba(127, 127, 127, 0.35);
        border-radius: 8px;
      }
      legend {
        padding: 0 4px;
        font-weight: 600;
      }
      label {
        display: flex;
        gap: 8px;
        align-items: start;
        margin-top: 6px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <h1>Kara live</h1>
    <!-- One live region, so a screen reader hears the state change rather
         than being told to go and look for it. -->
    <div id="state" role="status" aria-live="polite">
      <p id="headline">Checking…</p>
      <progress id="bar" max="100" value="0" hidden></progress>
      <p id="detail"></p>
    </div>
    <button id="action" type="button" disabled>Start</button>
    <fieldset id="on-ready">
      <legend>When ready</legend>
    </fieldset>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
